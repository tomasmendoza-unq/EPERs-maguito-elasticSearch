input {
  beats {
    port => 5044
  }
}

filter {
  # 1. PARSEO BASE (El Log de Spring Boot)
  # Asegura que todos los logs tengan estructura básica
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:log_level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:log_message}"
    }
    # Si el parseo base falla, añade un tag para poder filtrar logs sin estructura
    tag_on_failure => ["_grokparsefailure_base"]
  }

  # 2. CONVERSIÓN DE TIMESTAMP (¡Necesario antes del borrado!)
  date {
    match => ["timestamp", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
    # Elimina el campo 'timestamp' de texto original después de usarlo
    remove_field => ["timestamp"]
  }

  # 3. MANEJO DE EVENTOS ESPECÍFICOS DE PERSONAJE

  # A. CREADO Personaje
  if [log_message] =~ /^CREADO Personaje id=/ {
    grok {
      match => {
        "log_message" => "CREADO Personaje id=%{DATA:personaje_id} nombre=%{WORD:personaje_nombre} vida=%{NUMBER:personaje_vida:int} pesoMax=%{NUMBER:personaje_peso_max:int}"
      }
      add_tag => ["personaje_creado_completo"]

      # Borra el campo grande del log después de extraer la data
      remove_field => [ "log_message" ]
    }
  }

  # B. ACTUALIZADO Personaje
  else if [log_message] =~ /^ACTUALIZADO Personaje id=/ {
    grok {
      match => {
        "log_message" => "ACTUALIZADO Personaje id=%{DATA:personaje_id}"
      }
      add_tag => ["personaje_actualizado"]
      remove_field => [ "log_message" ]
    }
  }

  # C. ELIMINADO Personaje
  else if [log_message] =~ /^ELIMINADO Personaje id=/ {
    grok {
      match => {
        "log_message" => "ELIMINADO Personaje id=%{DATA:personaje_id}"
      }
      add_tag => ["personaje_eliminado"]
      remove_field => [ "log_message" ]
    }
  }

  # 4. LIMPIEZA FINAL (Aplica a todos los eventos que pasen)
  # Se eliminan los campos que no se necesitan en Elasticsearch o Kibana
  mutate {
    remove_field => [ "message", "host", "path" ]
  }
}

output {
  # Carga la data en el índice por día
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }
}